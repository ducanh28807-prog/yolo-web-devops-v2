name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: Kiểm thử Unit Test cho Backend
  # ==========================================
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt thư viện Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Pytest kiểm tra API
        run: |
          cd backend
          pytest -v

  # ==========================================
  # JOB 2: Kiểm tra biên dịch Frontend React
  # ==========================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt dependencies và Build React
        run: |
          cd frontend
          npm ci
          npm run build

  # ==========================================
  # JOB 3: Kiểm tra cấu hình Docker Compose
  # ==========================================
  docker-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra tính hợp lệ của file docker-compose.yml
        run: |
          docker compose config
